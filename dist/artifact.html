<style>/* Layout: sticky top bar · two columns (cluster stage | application panel) · stacks under 1100px.
   Palette and type follow MongoDB LeafyGreen tokens (Inter / JetBrains Mono stand in for the brand faces). */
:root {
  --bg: #F9FBFA;
  --surface: #FFFFFF;
  --surface-2: #F4F7F6;
  --line: #E8EDEB;
  --line-strong: #C1C7C6;
  --fg: #001E2B;
  --muted: #5C6C75;
  --faint: #889397;
  --accent: #00684A;
  --accent-bright: #00ED64;
  --accent-soft: #E3FCF7;
  --write: #016BF8;
  --write-soft: #E1F7FF;
  --read: #00A35C;
  --warn: #944F01;
  --warn-strong: #FFC010;
  --warn-soft: #FEF7DB;
  --bad: #DB3030;
  --bad-soft: #FFEAE5;
  --info: #1254B7;
  --info-soft: #E1F7FF;
  --node-secondary: #3D4F58;
  --node-ro: #FFFFFF;
  --hatch: #FFEAE5;
  --hatch-line: #F9B9AE;
  --shadow: 0 1px 2px rgba(0, 30, 43, .06), 0 4px 16px rgba(0, 30, 43, .05);
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #001E2B; --surface: #0B2533; --surface-2: #112733; --line: #1C2D38; --line-strong: #3D4F58;
    --fg: #E8EDEB; --muted: #A9B4B8; --faint: #7C8A90;
    --accent: #00ED64; --accent-bright: #00ED64; --accent-soft: #023430;
    --write: #3D9CFF; --write-soft: #0C2657; --read: #00D667;
    --warn: #FFC010; --warn-strong: #FFC010; --warn-soft: #3D2600;
    --bad: #FF6960; --bad-soft: #4A0D0B; --info: #7DB4FF; --info-soft: #0C2657;
    --node-secondary: #5C6C75; --node-ro: #112733; --hatch: #2A1210; --hatch-line: #5B2420;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #001E2B; --surface: #0B2533; --surface-2: #112733; --line: #1C2D38; --line-strong: #3D4F58;
  --fg: #E8EDEB; --muted: #A9B4B8; --faint: #7C8A90;
  --accent: #00ED64; --accent-bright: #00ED64; --accent-soft: #023430;
  --write: #3D9CFF; --write-soft: #0C2657; --read: #00D667;
  --warn: #FFC010; --warn-strong: #FFC010; --warn-soft: #3D2600;
  --bad: #FF6960; --bad-soft: #4A0D0B; --info: #7DB4FF; --info-soft: #0C2657;
  --node-secondary: #5C6C75; --node-ro: #112733; --hatch: #2A1210; --hatch-line: #5B2420;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2 { text-wrap: balance; margin: 0; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--write); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner, .layout, .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
.topbar-inner { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-block: 10px; }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select { max-width: min(360px, 80vw); }
select, .btn { height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 12px; cursor: pointer; }
select { padding-right: 28px; }
.btn:hover, select:hover { border-color: var(--accent); }
.btn.ghost { background: transparent; }
.lang { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 0 12px; height: 32px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; padding-block: 20px; align-items: start; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage, .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .sub { margin: -6px 0 0; color: var(--muted); font-size: 12.5px; }

/* Quick start */
.quick { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.quick ol { margin: 0; padding-left: 18px; flex: 1 1 520px; display: grid; gap: 2px; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; font-weight: 600; padding: 0; }

/* Status */
.status { border-radius: var(--radius); padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; box-shadow: var(--shadow); border-left-width: 5px; }
.status-main { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.status-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
.status-extra { color: var(--muted); font-size: 13px; }
.sev-ok { border-left-color: var(--accent); } .sev-ok .status-dot { background: var(--accent); }
.sev-warn { border-left-color: var(--warn-strong); background: var(--warn-soft); } .sev-warn .status-dot { background: var(--warn-strong); animation: pulse 1s ease-in-out infinite; }
.sev-info { border-left-color: var(--info); background: var(--info-soft); } .sev-info .status-dot { background: var(--info); }
.sev-bad { border-left-color: var(--bad); background: var(--bad-soft); } .sev-bad .status-dot { background: var(--bad); }

/* Rule chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips:empty { display: none; }
.rule { font: 600 10.5px/1 var(--font-mono); letter-spacing: .02em; color: var(--muted); text-decoration: none; border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 5px; white-space: nowrap; }
.rule:hover { color: var(--accent); border-color: var(--accent); }

/* Canvas */
.canvas-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
.canvas { display: block; width: 100%; height: auto; font-family: var(--font-body); }
.region-card { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1; }
.is-highest .region-card { stroke: var(--accent); }
.is-outage .region-card { stroke: var(--bad); stroke-width: 1.5; }
.is-isolated .region-card { stroke: var(--warn-strong); stroke-width: 2; stroke-dasharray: 8 6; }
.hatch-bg { fill: var(--hatch); } .hatch-line { stroke: var(--hatch-line); stroke-width: 3; }
.region-hatch { opacity: .7; pointer-events: none; }
.region-name { font-size: 14px; font-weight: 700; fill: var(--fg); }
.region-meta { font: 500 10.5px var(--font-mono); fill: var(--muted); }
.provider rect { fill: var(--surface); stroke: var(--line-strong); }
.provider-text { font: 700 10px var(--font-mono); fill: var(--fg); letter-spacing: .04em; }
.prov-aws rect { stroke: #FF9900; } .prov-gcp rect { stroke: #4285F4; } .prov-azure rect { stroke: #0089D6; }
.ribbon rect { stroke-width: 1; }
.ribbon.outage rect { fill: var(--bad); }
.ribbon.isolated rect { fill: var(--warn-strong); }
.ribbon-text { font: 700 9.5px var(--font-mono); letter-spacing: .06em; fill: var(--surface); }
.ribbon.isolated .ribbon-text { fill: #001E2B; }

.sbtn { cursor: pointer; }
.sbtn rect { fill: var(--surface); stroke: var(--line-strong); transition: fill .15s, stroke .15s; }
.sbtn:hover rect, .sbtn:focus-visible rect { stroke: var(--accent); }
.sbtn:focus-visible { outline: none; }
.sbtn:focus-visible rect { stroke: var(--write); stroke-width: 2; }
.sbtn-text { font-size: 11.5px; font-weight: 600; fill: var(--fg); pointer-events: none; }
.sbtn.danger-ghost .sbtn-text { fill: var(--bad); }
.sbtn.warn-ghost .sbtn-text { fill: var(--warn); }
.sbtn.active.danger rect { fill: var(--bad); stroke: var(--bad); } .sbtn.active.danger .sbtn-text { fill: var(--surface); }
.sbtn.active.warn rect { fill: var(--warn-strong); stroke: var(--warn-strong); } .sbtn.active.warn .sbtn-text { fill: #001E2B; }
.sbtn.disabled { cursor: not-allowed; opacity: .4; }
.sbtn.round .sbtn-text { font-size: 14px; }
.stepper-label { font-size: 11px; fill: var(--muted); font-weight: 500; }
.stepper-value { font: 700 13px var(--font-mono); fill: var(--fg); }
.icon-text { font-size: 14px; fill: var(--muted); pointer-events: none; } .icon-text.small { font-size: 9px; }
.region-name-btn:hover .region-name { fill: var(--accent); }
.add-region rect { fill: transparent; stroke: var(--line-strong); stroke-dasharray: 6 5; }
.add-region:hover rect { stroke: var(--accent); fill: var(--accent-soft); }
.add-plus { font-size: 30px; font-weight: 300; fill: var(--accent); }
.add-text { font-size: 12px; font-weight: 600; fill: var(--muted); }

/* Nodes */
.node { cursor: pointer; }
.node.locked { cursor: not-allowed; }
.node:focus-visible { outline: none; }
.node:focus-visible .body { stroke: var(--write); stroke-width: 3; }
.node .body { stroke-width: 2; transition: fill .25s, stroke .25s; }
.node:hover .body { stroke-width: 3; }
.role-primary .body { fill: var(--accent); stroke: var(--accent); }
.role-primary .glyph path, :root .role-primary .glyph ellipse { stroke: var(--surface); }
.role-secondary .body { fill: var(--surface); stroke: var(--node-secondary); }
.role-secondary.kind-readOnly .body { fill: var(--node-ro); stroke: var(--faint); stroke-dasharray: 4 3; }
.role-stepping_down .body { fill: var(--warn-strong); stroke: var(--warn); }
.role-down .body { fill: var(--bad-soft); stroke: var(--bad); stroke-dasharray: 3 3; }
.glyph path, .glyph ellipse { fill: none; stroke: var(--node-secondary); stroke-width: 1.6; }
.role-stepping_down .glyph path, .role-stepping_down .glyph ellipse { stroke: #001E2B; }
.cross { stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
.halo { fill: none; stroke: var(--accent-bright); stroke-width: 3; opacity: .55; animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.vote-ring { fill: none; stroke: var(--warn-strong); stroke-width: 2.5; stroke-dasharray: 5 4; animation: spin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
.pill { fill: var(--surface); stroke: var(--line-strong); }
.pill-text { font: 700 9px var(--font-mono); letter-spacing: .03em; fill: var(--muted); }
.role-primary .pill { fill: var(--accent); stroke: var(--accent); } .role-primary .pill-text { fill: var(--surface); }
.role-down .pill { fill: var(--bad-soft); stroke: var(--bad); } .role-down .pill-text { fill: var(--bad); }
.role-stepping_down .pill { fill: var(--warn-soft); stroke: var(--warn); } .role-stepping_down .pill-text { fill: var(--warn); }
.ack circle { fill: var(--write); stroke: var(--surface); stroke-width: 2; }
.ack path { fill: none; stroke: #FFFFFF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Arrows */
.arrow { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.arrow.write { stroke: var(--write); stroke-dasharray: 7 5; animation: flow 1s linear infinite; }
.arrow.read { stroke: var(--read); stroke-dasharray: 2 5; animation: flow 1.2s linear infinite reverse; }
.arrow.doomed { stroke: var(--warn); }
.arrow.blocked { stroke: var(--bad); stroke-dasharray: 3 4; animation: none; }
.arrow.waiting { stroke: var(--warn-strong); stroke-dasharray: 3 4; }
.ah-write { fill: var(--write); } .ah-read { fill: var(--read); } .ah-bad { fill: var(--bad); }
.x-mark { stroke: var(--bad); stroke-width: 2.4; stroke-linecap: round; }
.wait-dot { fill: var(--warn-strong); animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.op-label rect { fill: var(--surface); stroke-width: 1.2; }
.op-label.write rect { stroke: var(--write); } .op-label.read rect { stroke: var(--read); }
.op-label.blocked rect { stroke: var(--bad); } .op-label.waiting rect, .op-label.doomed rect { stroke: var(--warn); }
.op-label-text { font: 600 10.5px var(--font-mono); fill: var(--fg); }
.app rect { fill: var(--fg); }
.app-title { font-size: 13px; font-weight: 700; fill: var(--bg); }
.app-sub { font: 500 10.5px var(--font-mono); fill: var(--bg); opacity: .8; }
.app.down rect { fill: var(--bad-soft); stroke: var(--bad); stroke-dasharray: 4 3; }
.app.down .app-title, .app.down .app-sub { fill: var(--bad); }

@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .8; transform: scale(1.06); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .arrow, .halo, .vote-ring, .wait-dot { animation: none !important; } .tri-dot { transition: none !important; } }

/* Facts & warnings */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.fact-label { font-size: 11.5px; color: var(--muted); }
.fact-value { font: 700 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.fact.good .fact-value { color: var(--accent); } .fact.bad .fact-value { color: var(--bad); }
.warnings { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.warnings li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; background: var(--warn-soft); color: var(--fg); border-radius: 8px; padding: 7px 12px; font-size: 13px; }

/* Side panel */
.form { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.field select { width: 100%; font-family: var(--font-mono); font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; font-family: var(--font-mono); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.op { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; border-left-width: 4px; }
.op.ok { border-left-color: var(--accent); } .op.fail { border-left-color: var(--bad); } .op.wait { border-left-color: var(--warn-strong); }
.op-head { display: flex; justify-content: space-between; align-items: center; }
.op-kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.op-state { font-weight: 700; } .op.ok .op-state { color: var(--accent); } .op.fail .op-state { color: var(--bad); } .op.wait .op-state { color: var(--warn); }
.op-text { margin: 0; }
.note { margin: 0; font-size: 12.5px; color: var(--info); }
.risk { font-size: 11.5px; border-radius: 999px; padding: 2px 9px; font-weight: 500; }
.risk.warn { background: var(--warn-soft); color: var(--warn); } .risk.bad { background: var(--bad-soft); color: var(--bad); } .risk.good { background: var(--accent-soft); color: var(--accent); }
.chips.rules { gap: 4px; }

/* CAP */
.cap-top { display: grid; justify-items: center; gap: 6px; }
.cap-svg { width: 100%; max-width: 260px; height: auto; }
.tri { fill: url(#cap-grad); stroke: var(--line-strong); stroke-width: 1.5; }
.stop-cp { stop-color: var(--accent-soft); } .stop-ap { stop-color: var(--info-soft); }
.tri-end { font: 700 10px var(--font-mono); }
.tri-end.cp { fill: var(--accent); } .tri-end.ap { fill: var(--info); }
.tri-track { stroke: var(--faint); stroke-dasharray: 3 4; }
.tri-label { font: 700 14px var(--font-mono); fill: var(--fg); }
.tri-edge { font: 600 10px var(--font-mono); fill: var(--muted); }
.tri-dot { transition: transform .5s cubic-bezier(.3, .7, .2, 1); }
.dot { fill: var(--fg); } .dot-halo { fill: var(--accent-bright); opacity: .35; }
.cap-mode { font-weight: 700; font-size: 13px; border-radius: 999px; padding: 3px 12px; }
.mode-cp { background: var(--accent-soft); color: var(--accent); } .mode-ap { background: var(--info-soft); color: var(--info); } .mode-balanced { background: var(--warn-soft); color: var(--warn); }
.checks-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.checks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: start; font-size: 13px; }
.checks li.miss { color: var(--muted); }
.checks .mark { font-weight: 700; } .checks li.pass .mark { color: var(--accent); }
.explain { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 65ch; }
.explain.good { color: var(--accent); }
.explain .rule { margin-left: 2px; }
.fine { margin: 0; font-size: 11.5px; color: var(--faint); font-style: italic; }

/* Sources */
details.card summary { cursor: pointer; display: grid; gap: 2px; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary span { font-size: 12.5px; color: var(--muted); }
details.card summary h2::after { content: ' ▾'; }
details[open].card summary h2::after { content: ' ▴'; }
.sources { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.sources li { display: grid; gap: 4px; font-size: 13px; }
.src-head code { font: 600 11px var(--font-mono); background: var(--surface-2); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
.sources blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--line-strong); color: var(--muted); font-size: 12.5px; font-style: italic; }
.sources a { color: var(--accent); font-size: 12.5px; font-weight: 600; }

/* Log */
.log-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 8px; }
.log { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow-y: auto; font: 12px/1.6 var(--font-mono); }
.log li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; border-bottom: 1px dashed var(--line); }
.log time { color: var(--faint); font-variant-numeric: tabular-nums; }
.foot { padding-block: 8px 24px; color: var(--faint); font-size: 12px; }
</style>

    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><g fill="none" stroke="var(--surface)" stroke-width="1.8"><ellipse cx="17" cy="10.5" rx="7" ry="3"/><path d="M10,10.5 v12 a7,3 0 0 0 14,0 v-12"/><path d="M10,16.5 a7,3 0 0 0 14,0"/></g></svg>

rioridade menor pode assumir por pouco tempo)."},"ATLAS-PRIORITY-REGION":{url:`${K}/cluster-config/multi-cloud-distribution/`,quote:"Atlas sets the node in the first row of the Electable nodes table as the Highest Priority region. Atlas prioritizes nodes in this region for primary eligibility. Other nodes rank in the order that they appear.",en:"Atlas gives the first region the highest priority for primary; other regions rank in the order listed.",pt:"O Atlas d\xE1 \xE0 primeira regi\xE3o a maior prioridade para prim\xE1rio; as demais seguem a ordem da lista."},"ATLAS-PRIORITY-VALUES":{url:`${K}/architecture/current/high-availability/`,quote:"The priority fields must be defined in descending order and must consist of values between 7 and 1.",en:"Region priorities run from 7 (highest) down to 1.",pt:"As prioridades das regi\xF5es v\xE3o de 7 (maior) at\xE9 1."},"ELEC-NO-WRITES":{url:`${L}/core/replica-set-elections/`,quote:"The replica set cannot process write operations until the election completes successfully. The replica set can continue to serve read queries if such queries are configured to run on secondaries.",en:"No primary means no writes; reads continue only if they are allowed to run on secondaries.",pt:"Sem prim\xE1rio n\xE3o h\xE1 escrita; leituras continuam s\xF3 se puderem ir para secund\xE1rios."},"VOTE-LIMIT":{url:`${L}/core/replica-set-architectures/`,quote:"A replica set can have up to 50 members, but only 7 voting members.",en:"Up to 50 members, but at most 7 voting members.",pt:"At\xE9 50 membros, mas no m\xE1ximo 7 votantes."},"ATLAS-ELECTABLE-COUNT":{url:`${K}/cluster-config/multi-cloud-distribution/`,quote:"The total number of electable nodes across all providers and regions in the cluster must equal 3, 5, or 7.",en:"Atlas requires 3, 5 or 7 electable nodes in total.",pt:"O Atlas exige 3, 5 ou 7 n\xF3s eleg\xEDveis no total."},"FAULT-TOLERANCE":{url:`${L}/core/replica-set-architectures/`,quote:"Adding a member to the replica set does not always increase the fault tolerance.",en:"Fault tolerance = members that can fail while a majority remains (3\u21921, 4\u21921, 5\u21922, 6\u21922). Even counts add no tolerance.",pt:"Toler\xE2ncia a falhas = membros que podem cair mantendo a maioria (3\u21921, 4\u21921, 5\u21922, 6\u21922). N\xFAmero par n\xE3o aumenta a toler\xE2ncia."},"ATLAS-READONLY":{url:`${K}/cluster-config/multi-cloud-distribution/`,quote:"Read-only nodes don't provide high availability because they don't participate in elections. They can't become the primary for their cluster.",en:"Atlas read-only nodes do not vote and can never become primary; they serve secondary reads.",pt:"N\xF3s read-only do Atlas n\xE3o votam e nunca viram prim\xE1rio; atendem leituras em secund\xE1rio."},"DC-TWO":{url:`${L}/core/replica-set-architecture-geographically-distributed/`,quote:"If Data Center 1 goes down, the replica set becomes read-only. If Data Center 2 goes down, the replica set remains writable as the members in Data Center 1 can hold an election.",en:"With two locations, losing the one that holds the majority makes the replica set read-only.",pt:"Com duas localidades, perder a que tem a maioria deixa o replica set somente leitura."},"DC-THREE":{url:`${L}/core/replica-set-architecture-geographically-distributed/`,quote:"If any Data Center goes down, the replica set remains writable as the remaining members can hold an election.",en:"Spread so no single location holds a majority (e.g. 1-1-1, 2-2-1) and any one location can fail while staying writable.",pt:"Distribuindo para que nenhuma localidade tenha a maioria (ex.: 1-1-1, 2-2-1), qualquer uma pode cair e o cluster segue grav\xE1vel."},"ATLAS-REGION-HA":{url:`${K}/cluster-config/multi-cloud-distribution/`,quote:"Region: Minimum of one node set in three or more different regions. More than one node per region.",en:"To survive a region failure, Atlas recommends nodes in three or more regions.",pt:"Para sobreviver \xE0 queda de uma regi\xE3o, o Atlas recomenda n\xF3s em tr\xEAs ou mais regi\xF5es."},"ATLAS-SIM-OUTAGE":{url:`${K}/tutorial/test-resilience/simulate-regional-outage/`,quote:"During a simulated outage, Atlas: Removes network connectivity to nodes in the selected regions.",en:"You can rehearse this on a real cluster: Atlas can simulate a regional outage.",pt:"D\xE1 para ensaiar isso num cluster real: o Atlas simula queda de regi\xE3o."},"WC-0":{url:`${L}/reference/write-concern/`,quote:"Requests no acknowledgment of the write operation. [...] Data can be rolled back if the primary steps down before the write operations replicate to any of the secondaries.",en:"w:0 requests no acknowledgment; the write can be lost or rolled back and is not retryable.",pt:"w:0 n\xE3o pede confirma\xE7\xE3o; a escrita pode se perder ou sofrer rollback e n\xE3o \xE9 retentada."},"WC-1":{url:`${L}/reference/write-concern/`,quote:"Requests acknowledgment that the write operation has propagated to the standalone mongod or the primary in a replica set. Data can be rolled back if the primary steps down before the write operations replicate to any of the secondaries.",en:"w:1 is acknowledged by the primary alone; it can be rolled back if the primary fails before replicating.",pt:"w:1 \xE9 confirmado s\xF3 pelo prim\xE1rio; pode sofrer rollback se o prim\xE1rio cair antes de replicar."},"WC-MAJORITY":{url:`${L}/reference/write-concern/`,quote:"Requests acknowledgment that the calculated majority of data-bearing voting members have durably written the change to their local oplog.",en:'w:"majority" waits for a majority of voting, data-bearing members. It is the default.',pt:'w:"majority" espera a maioria dos membros votantes com dados. \xC9 o padr\xE3o.'},"ATLAS-WC-ADJUSTS":{url:`${K}/architecture/current/high-availability/`,quote:"Using majority instead of a definite number value like 2 allows Atlas to automatically adjust to requiring replication across fewer nodes if you experience a temporary node outage, allowing writes to continue after automatic failover.",en:'"majority" keeps writes flowing after failover; a fixed number may not.',pt:'"majority" mant\xE9m as escritas ap\xF3s o failover; um n\xFAmero fixo pode n\xE3o manter.'},"WC-N":{url:`${L}/reference/write-concern/`,quote:"Secondaries do not need to be voting members to meet the write concern threshold. [...] If you do not specify the wtimeout option and the level of write concern is unachievable, the write operation will block indefinitely. [...] MongoDB does not undo successful data modifications performed before the write concern exceeded the wtimeout time limit.",en:"w:<n> needs n members (non-voting count). If fewer are reachable it blocks; with wtimeout it errors, but the write is not undone.",pt:"w:<n> precisa de n membros (n\xE3o votantes contam). Se houver menos, trava; com wtimeout retorna erro, mas a escrita n\xE3o \xE9 desfeita."},"WC-J":{url:`${L}/reference/write-concern/`,quote:'If journaling is enabled, w: "majority" may imply j: true. The writeConcernMajorityJournalDefault replica set configuration setting determines the behavior.',en:'j:true waits for the on-disk journal. "majority" implies it by default; without it, majority writes could roll back only if a majority crashes and restarts.',pt:'j:true espera o journal em disco. "majority" j\xE1 implica isso por padr\xE3o; sem ele, s\xF3 haveria rollback se a maioria ca\xEDsse e reiniciasse junta.'},ROLLBACK:{url:`${L}/core/replica-set-rollbacks/`,quote:'To prevent rollbacks of data that have been acknowledged to the client, run all voting members with journaling enabled and use { w: "majority" } write concern.',en:'Rollback reverts writes the old primary accepted but never replicated. w:"majority" + journaling prevents rollback of acknowledged writes.',pt:'Rollback desfaz escritas que o prim\xE1rio antigo aceitou e n\xE3o replicou. w:"majority" + journal evita rollback de escritas confirmadas.'},"PARTITION-TWO-PRIMARIES":{url:`${L}/core/causal-consistency-read-write-concerns/`,quote:"Writes with { w: 1 } write concern can complete on either P old or P new. However, the writes to P old (as well as the writes replicated to S 1) roll back once these members regain communication with the rest of the replica set.",en:'During a partition, the old primary may briefly still accept w:1 writes. Those writes roll back when the partition heals; "majority" writes cannot complete there.',pt:'Numa parti\xE7\xE3o, o prim\xE1rio antigo pode aceitar escritas w:1 por alguns instantes. Elas sofrem rollback quando a rede volta; escritas "majority" n\xE3o completam ali.'},"RP-PRIMARY":{url:`${L}/core/read-preference/`,quote:"If the primary is unavailable, read operations produce an error or throw an exception.",en:"primary: reads only from the primary; error if there is none.",pt:"primary: l\xEA s\xF3 do prim\xE1rio; erro se n\xE3o houver."},"RP-PRIMARY-PREFERRED":{url:`${L}/core/read-preference/`,quote:"In most situations, operations read from the primary member of the set. However, if the primary is unavailable, as is the case during failover situations, operations read from secondary members.",en:"primaryPreferred: primary when it exists, otherwise a secondary.",pt:"primaryPreferred: prim\xE1rio quando existe; sen\xE3o, um secund\xE1rio."},"RP-SECONDARY":{url:`${L}/core/read-preference/`,quote:"Operations read only from the secondary members of the set. If no secondaries are available, then this read operation produces an error or exception.",en:"secondary: reads only from secondaries; error if none is reachable.",pt:"secondary: l\xEA s\xF3 de secund\xE1rios; erro se nenhum estiver acess\xEDvel."},"RP-SECONDARY-PREFERRED":{url:`${L}/core/read-preference/`,quote:"Operations typically read data from secondary members of the replica set.",en:"secondaryPreferred: a secondary when available, otherwise the primary.",pt:"secondaryPreferred: um secund\xE1rio quando poss\xEDvel; sen\xE3o, o prim\xE1rio."},"RP-NEAREST":{url:`${L}/core/read-preference/`,quote:"Reads in the nearest mode do not consider whether a member is a primary or secondary when routing read operations: primaries and secondaries are treated equivalently.",en:"nearest: the lowest-latency member, primary or secondary.",pt:"nearest: o membro de menor lat\xEAncia, prim\xE1rio ou secund\xE1rio."},"RP-STALE":{url:`${L}/core/read-preference/`,quote:"All read preference modes except primary may return stale data because secondaries replicate operations from the primary in an asynchronous process.",en:"Any read served by a secondary may be stale.",pt:"Qualquer leitura atendida por secund\xE1rio pode estar desatualizada."},"RC-LOCAL":{url:`${L}/reference/read-concern/`,quote:"The query returns data from the instance with no guarantee that the data has been written to a majority of the replica set members. Data may be rolled back.",en:"local / available: newest data on that node, which may later be rolled back.",pt:"local / available: dado mais novo daquele n\xF3, que pode sofrer rollback depois."},"RC-MAJORITY":{url:`${L}/reference/read-concern/`,quote:"The query returns the data acknowledged by a majority of the replica set members. Returned documents are durable, even if a failure occurs.",en:"majority: only majority-acknowledged data, which is never rolled back.",pt:"majority: s\xF3 dado confirmado pela maioria, que nunca sofre rollback."},"RC-LINEARIZABLE":{url:`${L}/reference/read-concern/`,quote:"You can only specify linearizable read concern for read operations on the primary. [...] Always use maxTimeMS with linearizable read concern if a majority of data-bearing members are unavailable.",en:"linearizable: reflects every majority-acknowledged write before the read. Primary only; use maxTimeMS.",pt:"linearizable: reflete toda escrita confirmada pela maioria antes da leitura. S\xF3 no prim\xE1rio; use maxTimeMS."},"RC-SNAPSHOT":{url:`${L}/reference/read-concern/`,quote:'A query with read concern "snapshot" returns majority-committed data as it appears across shards from a specific single point in time in the recent past.',en:"snapshot: majority-committed data at one point in time (transactions, find, aggregate, distinct).",pt:"snapshot: dado confirmado pela maioria em um ponto no tempo (transa\xE7\xF5es, find, aggregate, distinct)."},"RETRYABLE-WRITES":{url:`${L}/core/retryable-writes/`,quote:"Drivers wait serverSelectionTimeoutMS to find a new primary before retrying. Retryable writes fail if failover takes longer than this timeout.",en:"Drivers retry a write once, after waiting up to serverSelectionTimeoutMS for a new primary. w:0 writes are not retried.",pt:"O driver retenta a escrita uma vez, ap\xF3s esperar at\xE9 serverSelectionTimeoutMS por um novo prim\xE1rio. Escritas w:0 n\xE3o s\xE3o retentadas."},CAUSAL:{url:`${L}/core/causal-consistency-read-write-concerns/`,quote:'If you want causal consistency with data durability, then, as seen from the table, only read operations with "majority" read concern and write operations with "majority" write concern can guarantee all four causal consistency guarantees.',en:'Only "majority" reads + "majority" writes keep read-your-writes and monotonic reads, even across a partition.',pt:'S\xF3 leituras "majority" + escritas "majority" garantem ler suas pr\xF3prias escritas e leituras monot\xF4nicas, mesmo numa parti\xE7\xE3o.'}},ga=Object.keys(se);var I=e=>String(e).replace(/[&<>"]/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[t]),Te=e=>[...new Set(e)];function F(e,t){return Te(e).map(a=>{let r=se[a];return`<a class="rule" href="${r.url}" target="_blank" rel="noopener" title="${I(r[t]||r.en)}">${a}</a>`}).join("")}var U=(e,t)=>(e.regions.find(a=>a.id===t)||{}).name||"",X=(e,t)=>e.nodes.find(a=>a.id===t);function Ce(e,t,a,r,o,i=5){let d={WRITABLE:"ok",ELECTING:"warn",NO_MAJORITY:"info",ALL_DOWN:"bad"}[t.status],l=t.primaryId?X(t,t.primaryId):null,s=Math.max(0,...t.components.map(u=>u.aliveElectable)),c=a(`status.${t.status}`,{region:l?U(e,l.regionId):"",s:o,have:s,V:t.
